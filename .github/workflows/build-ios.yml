name: Build iOS (unsigned, for AltStore sideload)

on:
  workflow_dispatch:

jobs:
  # Fast, cheap, isolated sanity check that the ported C# actually compiles —
  # runs on a free ubuntu-latest runner (a few minutes), not on the
  # production AWS box, and not on scarce macOS minutes. Run this first;
  # only kick off build-ios once this is green.
  build-linux-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # The full "maui" meta-workload pulls in iOS/macCatalyst, which only
      # install on macOS. maui-tizen is the one platform workload that does
      # install on Linux, and it's the one the SDK's workload resolver
      # actually asks for when building the bare (non-suffixed) net10.0 TFM.
      - name: Install MAUI workload (Linux-installable subset)
        run: dotnet workload install maui-tizen

      - name: Build net10.0 (compile-only sanity check, no platform SDKs needed)
        run: dotnet build maui-client/BridgeToFreedom.csproj -f net10.0

  build-ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      # Pinned to the exact .NET 10 GA release, not a floating '10.0.x' —
      # the latest 10.0.302 patch bundles an iOS workload pack calibrated
      # against iOS SDK 26.5, which demands Xcode 26.6 (not yet on this
      # runner, confirmed max is 26.3). An earlier SDK patch's default
      # workload pack should target an earlier iOS SDK Xcode 26.3 already covers.
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.100'

      # Diagnostic: list every Xcode actually installed on this runner image
      # (stable AND beta) so we know what's really available rather than
      # guessing — the .NET for iOS workload pack wants a specific Xcode
      # version that "latest-stable" alone may not reach.
      - name: List installed Xcode versions
        run: ls -1 /Applications | grep -i xcode

      # The .NET for iOS workload matching .NET 10 targets a recent iOS SDK
      # and needs a matching-enough Xcode — newer than what some macOS runner
      # images select by default. "latest" (not "latest-stable") also
      # considers betas, which is often where a very new required version
      # actually lives on a GitHub-hosted image.
      - name: Select latest available Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest

      - name: Install MAUI iOS workload
        run: dotnet workload install maui-ios

      # No separate restore step: unlike `dotnet build`, `dotnet restore`
      # doesn't have a -f/--framework flag — passing one gets parsed as a
      # second positional project argument ("Only one project can be
      # specified"). `dotnet build` below restores for the right TFM itself.

      # Builds for a real device (ios-arm64), with codesigning disabled — we
      # don't have a paid Apple Developer account to sign with in CI.
      # AltServer re-signs the .ipa itself using your free Apple ID at
      # install time, so it does not need to arrive here already signed.
      #
      # -p:TargetFrameworks=net10.0-ios (not just -f) is required: the
      # csproj's conditions add net10.0-android/-windows/-maccatalyst too on
      # any non-Linux OS, and `dotnet restore` always restores every TFM in
      # the project regardless of -f (-f only picks which one to build
      # afterwards) — so without overriding the property outright, restore
      # fails demanding the Android workload too, which this job never installs.
      - name: Build unsigned .app/.ipa for device (ios-arm64)
        run: |
          dotnet build maui-client/BridgeToFreedom.csproj \
            -c Release \
            -p:TargetFrameworks=net10.0-ios \
            -p:RuntimeIdentifier=ios-arm64 \
            -p:ArchiveOnBuild=true \
            -p:BuildIpa=true \
            -p:CodesignKey="" \
            -p:CodesignProvision="" \
            -p:_RequireCodeSigning=false \
            -p:EnableCodeSigning=false

      - name: List build output (debugging aid)
        if: always()
        run: find maui-client/bin -iname "*.ipa" -o -iname "*.app" -o -iname "*.xcarchive" | tee found.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: BridgeToFreedom-ios-unsigned
          path: |
            maui-client/bin/**/*.ipa
            maui-client/bin/**/*.app
          if-no-files-found: warn
