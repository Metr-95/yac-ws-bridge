name: Build iOS (unsigned, for AltStore sideload)

on:
  workflow_dispatch:

jobs:
  # Fast, cheap, isolated sanity check that the ported C# actually compiles —
  # runs on a free ubuntu-latest runner (a few minutes), not on the
  # production AWS box, and not on scarce macOS minutes. Run this first;
  # only kick off build-ios once this is green.
  build-linux-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # The full "maui" meta-workload pulls in iOS/macCatalyst, which only
      # install on macOS. maui-tizen is the one platform workload that does
      # install on Linux, and it's the one the SDK's workload resolver
      # actually asks for when building the bare (non-suffixed) net10.0 TFM.
      - name: Install MAUI workload (Linux-installable subset)
        run: dotnet workload install maui-tizen

      - name: Build net10.0 (compile-only sanity check, no platform SDKs needed)
        run: dotnet build maui-client/BridgeToFreedom.csproj -f net10.0

  build-ios:
    # Tried pinning an older .NET SDK patch first — didn't help, because
    # `dotnet workload install` always pulls the newest workload pack from
    # NuGet regardless of SDK patch version. Trying a newer runner image
    # instead, in case GitHub has one with Xcode 26.6 already (Apple's
    # year-based versioning means the image might be named macos-26 rather
    # than macos-15/16). If this label doesn't exist, the job fails fast at
    # queue time rather than burning build minutes.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # Diagnostic: list every Xcode actually installed on this runner image
      # (stable AND beta) so we know what's really available rather than
      # guessing — the .NET for iOS workload pack wants a specific Xcode
      # version that "latest-stable" alone may not reach.
      - name: List installed Xcode versions
        run: ls -1 /Applications | grep -i xcode

      # The .NET for iOS workload matching .NET 10 targets a recent iOS SDK
      # and needs a matching-enough Xcode — newer than what some macOS runner
      # images select by default. "latest" (not "latest-stable") also
      # considers betas, which is often where a very new required version
      # actually lives on a GitHub-hosted image.
      - name: Select latest available Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest

      - name: Install MAUI iOS workload
        run: dotnet workload install maui-ios

      # A real device (arm64) binary structurally needs SOME code signature
      # to be a valid Mach-O — but it does NOT need to be an Apple-issued
      # identity for our purposes: AltServer strips and re-signs everything
      # itself at install time using your free Apple ID, exactly like it
      # already did when it installed AltStore itself. So we generate a
      # throwaway, purely local self-signed certificate here — no real
      # Apple account, no secrets, nothing that leaves this runner.
      - name: Create throwaway self-signed codesigning identity
        run: |
          set -euo pipefail
          KEYCHAIN=build.keychain
          KEYCHAIN_PASSWORD=$(openssl rand -base64 24)
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          EXISTING=$(security list-keychains -d user | sed 's/"//g')
          security list-keychains -d user -s "$KEYCHAIN" $EXISTING

          CERT_NAME="BTF Sideload Adhoc"
          openssl req -x509 -newkey rsa:2048 -keyout key.pem -out cert.pem -days 365 -nodes \
            -subj "/CN=$CERT_NAME" \
            -addext "extendedKeyUsage=codeSigning" \
            -addext "keyUsage=digitalSignature"

          # -legacy: OpenSSL 3.x defaults to AES-256-CBC encryption + SHA-256
          # MAC for PKCS#12, which macOS's Security framework (used by
          # `security import`) can't parse — it only understands the old
          # RC2/3DES-based format and fails with a misleading "wrong
          # password?" MAC-verification error even though the password is
          # right. -legacy forces the old, macOS-compatible format.
          openssl pkcs12 -export -legacy -out cert.p12 -inkey key.pem -in cert.pem -passout pass:temppass

          security import cert.p12 -k "$KEYCHAIN" -P temppass -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"

          echo "CODESIGN_IDENTITY=$CERT_NAME" >> "$GITHUB_ENV"

      # No separate restore step: unlike `dotnet build`, `dotnet restore`
      # doesn't have a -f/--framework flag — passing one gets parsed as a
      # second positional project argument ("Only one project can be
      # specified"). `dotnet build` below restores for the right TFM itself.
      #
      # -p:TargetFrameworks=net10.0-ios (not just -f) is required: the
      # csproj's conditions add net10.0-android/-windows/-maccatalyst too on
      # any non-Linux OS, and `dotnet restore` always restores every TFM in
      # the project regardless of -f (-f only picks which one to build
      # afterwards) — so without overriding the property outright, restore
      # fails demanding the Android workload too, which this job never installs.
      #
      # Deliberately NOT passing ArchiveOnBuild/BuildIpa: creating a full
      # Xcode .xcarchive hard-requires a "real" (Apple-chain-validated)
      # signing identity + provisioning profile, which a self-signed
      # certificate can't satisfy. A plain device build only needs the
      # binary to carry *a* signature to be valid Mach-O — codesign itself
      # doesn't validate the certificate's trust chain. We zip the .app into
      # an .ipa by hand afterwards (an .ipa is just a zip of Payload/*.app).
      - name: Build .app for device (ios-arm64), self-signed
        run: |
          dotnet build maui-client/BridgeToFreedom.csproj \
            -c Release \
            -p:TargetFrameworks=net10.0-ios \
            -p:RuntimeIdentifier=ios-arm64 \
            -p:CodesignKey="$CODESIGN_IDENTITY"

      - name: Package .app into a sideload-able .ipa (Payload/*.app zip)
        if: always()
        run: |
          set -euo pipefail
          APP_DIR=$(find maui-client/bin -type d -iname "*.app" | head -n1)
          if [ -z "$APP_DIR" ]; then
            echo "No .app bundle found — build likely failed before producing output."
            exit 0
          fi
          echo "Found: $APP_DIR"
          mkdir -p ipa_root/Payload
          cp -R "$APP_DIR" ipa_root/Payload/
          (cd ipa_root && zip -qr ../BridgeToFreedom-unsigned.ipa Payload)
          ls -la BridgeToFreedom-unsigned.ipa

      - name: List build output (debugging aid)
        if: always()
        run: find maui-client/bin -iname "*.app" | tee found.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: BridgeToFreedom-ios-unsigned
          path: |
            BridgeToFreedom-unsigned.ipa
            maui-client/bin/**/*.app
          if-no-files-found: warn
